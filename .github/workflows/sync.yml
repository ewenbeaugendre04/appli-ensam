name: Synchro Lise et publication

on:
  schedule:
    - cron: "7 * * * *" # toutes les heures
  workflow_dispatch: # lancé aussi par l'app après chaque modification
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r app/. _site/

      - name: Synchroniser Lise, tâches et partiels
        continue-on-error: true # le site est publié même si la synchro échoue
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ github.repository_owner }}/appli-ensam-data
          OUT_DIR: _site
        run: node scripts/sync.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub désactive les tâches planifiées après 60 jours sans activité : petit commit mensuel
      - name: Maintenir la tâche active
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            date -u > .keepalive
            git config user.name "Appli ENSAM"
            git config user.email "appli-ensam@users.noreply.github.com"
            git add .keepalive
            git commit -m "Maintien de la synchro"
            git push
          fi
